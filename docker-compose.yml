services:
  db:
    image: postgres:16
    container_name: todolist_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - todolist_db_data:/var/lib/postgresql/data

volumes:
  todolist_db_data:
